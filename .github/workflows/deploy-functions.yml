# Edge Functions automatisch zu Supabase deployen (Konzept KI-Vorschläge §7, Uli 02.11.2026)
# Läuft nach jedem Push auf main, der etwas unter supabase/functions/ ändert.
# Deployt nur die geänderten Funktionen; bei Änderungen in einem gemeinsamen Ordner (_shared) alle.
# Einmalig nötig: GitHub › Settings › Secrets and variables › Actions › New repository secret
#   Name: SUPABASE_ACCESS_TOKEN   Wert: Token aus https://supabase.com/dashboard/account/tokens
# Manuell starten: Actions › „Edge Functions deployen“ › Run workflow (deployt dann alle).
name: Edge Functions deployen

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: pflnniklvqbwjwrjswaz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Geänderte Funktionen bestimmen
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD~1 HEAD | grep -q '^supabase/functions/_'; then
            list=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' -exec basename {} \; | sort)
          else
            list=$(git diff --name-only HEAD~1 HEAD | grep '^supabase/functions/' | cut -d/ -f3 | grep -v '^_' | sort -u)
          fi
          # nur Ordner, die noch existieren (gelöschte Funktionen überspringen)
          keep=""
          for f in $list; do [ -f "supabase/functions/$f/index.ts" ] && keep="$keep $f"; done
          echo "functions=$keep" >> "$GITHUB_OUTPUT"
          echo "Zu deployen:$keep"

      - name: Deployen
        if: steps.changed.outputs.functions != ''
        run: |
          for f in ${{ steps.changed.outputs.functions }}; do
            echo "::group::$f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
